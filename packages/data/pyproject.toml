[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newangle-data"
version = "0.1.0"
description = "NewAngle data-model foundation: SQLAlchemy models, Alembic migrations, and Pydantic validation schemas for entities, sources, events, and observations."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic revision files are machine-generated (alembic revision --autogenerate).
# Their inline SQL constraint/column definitions are sometimes long literal
# strings that would only become less readable if force-wrapped; exempted
# from line-length only, not from other lint rules.
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
